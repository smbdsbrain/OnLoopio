plugins { id 'com.android.application' }
android {
    namespace 'io.onloopio'
    testNamespace 'io.onloopio.tests'
    compileSdk 35
    defaultConfig {
        applicationId 'io.onloopio'
        minSdk 17
        targetSdk 17
        versionCode 17
        versionName '0.10.1'
        testInstrumentationRunner 'io.onloopio.OnLoopioTestRunner'
        testApplicationId 'io.onloopio.tests'
        manifestPlaceholders = [testedPackage: 'io.onloopio']
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { debuggable true }
        release { debuggable false; minifyEnabled false }
    }
    lint { disable 'ExpiredTargetSdkVersion', 'OldTargetApi' }
    sourceSets { test.java.srcDir rootProject.file('tests') }
}
dependencies {
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.base.jar",
        "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.runner.jar",
        "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.mock.jar")
}
// Opt-in disposable package for synthetic Type A validation; never a release artifact.
if (project.hasProperty('validationOnly')) {
    android.defaultConfig.applicationId 'io.onloopio.validation'
    android.defaultConfig.testApplicationId 'io.onloopio.validation.tests'
    android.defaultConfig.manifestPlaceholders.testedPackage = 'io.onloopio.validation'
    android.sourceSets.debug.manifest.srcFile 'src/validation/AndroidManifest.xml'
}

// Windows and CI must interpret localized source text identically.
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
